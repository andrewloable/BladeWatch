org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Without this the Flutter Gradle plugin CLEARS app/build.gradle.kts's ndk.abiFilters and puts
# back its own list (FlutterPlugin.configureAbiWithoutSplits), so the app's list -- exactly the
# ABIs flutter_pear ships native code for -- would not be the one that ships. Before
# flutter_pear 0.4.8 that meant an armeabi-v7a APK with lib/armeabi-v7a/libflutter.so and
# nothing else for that ABI, which installed on 32-bit ARM and failed at worklet start.
disable-abi-filtering=true
