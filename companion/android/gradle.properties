org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Without this the Flutter Gradle plugin CLEARS app/build.gradle.kts's ndk.abiFilters and puts
# back its own list, armeabi-v7a included (FlutterPlugin.configureAbiWithoutSplits) -- so a
# 32-bit ARM phone could install the APK and then fail at worklet start, because flutter_pear
# ships no native libraries for that ABI. Verified: without it the debug APK had
# lib/armeabi-v7a/libflutter.so and nothing else for that ABI.
disable-abi-filtering=true
