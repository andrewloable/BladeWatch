org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# These two flags were added by the Flutter template and MUST STAY, even though AGP
# now prints "WARNING: The option setting 'android.newDsl=false' is deprecated" (and the
# same for builtInKotlin) on every build.
#
# Removing them was tried on 2026-09-15 and FAILS THE BUILD at configuration time, in
# under half a second - they opt this module out of AGP's new DSL and its built-in Kotlin
# support, and the Flutter toolchain still depends on the old behaviour. The warnings say
# the opt-out will eventually go away; when it does, this needs a Flutter/AGP upgrade, not
# a line deletion.
android.newDsl=false
android.builtInKotlin=false
# NOTE: do NOT pin org.gradle.java.home here. It used to hardcode
# /Library/Java/JavaVirtualMachines/openjdk-21.jdk/Contents/Home, which exists only
# on one developer's Mac, so the Flutter APK could not be built on any other machine
# or in CI ("Java home supplied is invalid"). Gradle falls back to JAVA_HOME, which
# is what every other environment sets.
