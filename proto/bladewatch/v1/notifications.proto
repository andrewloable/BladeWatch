syntax = "proto3";

package bladewatch.v1;

option java_package = "net.bladewatch.app.grpc.v1";
option java_multiple_files = true;

// NotificationsService manages Web Push subscriptions and notification preferences.
//
// HTTP mapping:
//   GetCategories        GET  /api/notifications/categories
//   Subscribe            POST /api/push/subscribe
//   Unsubscribe          POST /api/push/unsubscribe
//   ListSubscriptions    GET  /api/push/subscriptions
//   UpdatePreferences    POST /api/push/preferences
//   SendTest             POST /api/push/test
//   ListInbox            (Connect only)
service NotificationsService {
  rpc GetCategories(GetCategoriesRequest) returns (GetCategoriesResponse);
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse);
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (UpdatePreferencesResponse);
  rpc SendTest(SendTestRequest) returns (SendTestResponse);
  // Store and forward (BladeWatch-rdtj.14): the car keeps the notifications it raised, and a
  // companion fetches the ones it has not seen whenever it connects -- over the LAN or Pear, with
  // no push service in between. Oldest first.
  rpc ListInbox(ListInboxRequest) returns (ListInboxResponse);
}

// NotificationSeverity mirrors NotificationEvent.Severity.
enum NotificationSeverity {
  NOTIFICATION_SEVERITY_UNSPECIFIED = 0;
  NOTIFICATION_SEVERITY_INFO = 1;
  NOTIFICATION_SEVERITY_ALERT = 2;
  NOTIFICATION_SEVERITY_CRITICAL = 3;
}

// QuietHoursPref defines a window (minutes since midnight) during which
// non-critical push notifications are suppressed.
message QuietHoursPref {
  int32 start_min = 1;
  int32 end_min = 2;
  bool allow_critical = 3;
}

// PushKeys carries the ECDH/auth keys from the browser PushSubscription.
message PushKeys {
  string p256dh = 1;
  string auth = 2;
}

// PushSubscriptionRecord is one registered device for the settings UI.
message PushSubscriptionRecord {
  string id = 1;
  string label = 2;
  int64 created_at = 3;
  int64 last_seen_at = 4;
  string min_severity = 5;
  repeated string muted_categories = 6;
  QuietHoursPref quiet_hours = 7;
}

message GetCategoriesRequest {}

message GetCategoriesResponse {
  // Forwarded registry JSON blob from CategoryRegistry.rawJson().
  string categories_json = 1;
  string vapid_public_key = 2;
}

message SubscribeRequest {
  string endpoint = 1;
  PushKeys keys = 2;
  string label = 3;
}

message SubscribeResponse {
  bool success = 1;
  string id = 2;
  string error = 3;
}

message UnsubscribeRequest {
  // Either id or endpoint must be set.
  string id = 1;
  string endpoint = 2;
}

message UnsubscribeResponse {
  bool success = 1;
}

message ListSubscriptionsRequest {}

message ListSubscriptionsResponse {
  bool success = 1;
  repeated PushSubscriptionRecord subscriptions = 2;
}

message UpdatePreferencesRequest {
  string id = 1;
  repeated string muted_categories = 2;
  string min_severity = 3;
  // Set to null-equivalent (has_quiet_hours=false) to clear.
  QuietHoursPref quiet_hours = 4;
  bool has_quiet_hours = 5;
}

message UpdatePreferencesResponse {
  bool success = 1;
  string error = 2;
}

message SendTestRequest {
  string category = 1;
  string severity = 2;
}

message SendTestResponse {
  bool success = 1;
}

// One notification the car raised, kept for companions (BladeWatch-rdtj.14).
message InboxEntry {
  // Strictly increasing, and never reused -- also across daemon restarts.
  int64 id = 1;
  int64 timestamp_ms = 2;
  // Dotted category, e.g. "surveillance.motion".
  string category = 3;
  NotificationSeverity severity = 4;
  string title = 5;
  string body = 6;
  // Deep link the source gave, e.g. to the recording; empty when none.
  string click_url = 7;
  // Events with the same tag supersede each other (e.g. "recording in progress" by the final
  // alert): the car keeps only the newest, and a companion should show only the newest it has.
  // Empty when the source gave none.
  string tag = 8;
}

message ListInboxRequest {
  // Entries with an id greater than this; 0 for everything still held.
  int64 after_id = 1;
  // At most this many, oldest first; 0 means 100, and it is capped at 500.
  int32 limit = 2;
}

message ListInboxResponse {
  repeated InboxEntry entries = 1;
  // The newest and oldest ids the car still holds (0 when empty). The inbox is bounded: a
  // companion whose after_id is below oldest_id - 1 missed entries that were dropped.
  int64 latest_id = 2;
  int64 oldest_id = 3;
}
