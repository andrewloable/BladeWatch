syntax = "proto3";

package bladewatch.v1;

option java_package = "net.bladewatch.app.grpc.v1";
option java_multiple_files = true;

// VehicleService exposes BYD vehicle state reads and control commands.
//
// HTTP mapping:
//   GetState             GET  /api/vehicle/state
//   GetAcDiagnostics     GET  /api/vehicle/ac-diagnostics
//   Lock                 POST /api/vehicle/lock
//   Unlock               POST /api/vehicle/unlock
//   Trunk                POST /api/vehicle/trunk
//   MoveWindow           POST /api/vehicle/window
//   Flash                POST /api/vehicle/flash
//   FindCar              POST /api/vehicle/find-car
//   SetClimate           POST /api/vehicle/climate
//   SetLights            POST /api/vehicle/lights
//   SetScreen            POST /api/vehicle/screen
//   SetMediaVolume       POST /api/vehicle/media-volume
//   SetAdas              POST /api/vehicle/adas
//   SetBatteryHeat       POST /api/vehicle/battery-heat
//   GetChargingSchedule  GET  /api/vehicle/charging-schedule
//   SetChargingSchedule  POST /api/vehicle/charging-schedule
//   GetChargeCap         GET  /api/vehicle/charge-cap
//   SetChargeCap         POST /api/vehicle/charge-cap
//   GetGpsLocation       GET  /api/gps
//   StartGps             POST /api/gps/start
//   StopGps              POST /api/gps/stop
service VehicleService {
  rpc GetState(GetVehicleStateRequest) returns (GetVehicleStateResponse);
  rpc GetAcDiagnostics(GetAcDiagnosticsRequest) returns (GetAcDiagnosticsResponse);
  rpc Lock(LockRequest) returns (VehicleCommandResponse);
  rpc Unlock(UnlockRequest) returns (VehicleCommandResponse);
  rpc Trunk(TrunkRequest) returns (VehicleCommandResponse);
  rpc MoveWindow(MoveWindowRequest) returns (VehicleCommandResponse);
  rpc Flash(FlashRequest) returns (VehicleCommandResponse);
  rpc FindCar(FindCarRequest) returns (VehicleCommandResponse);
  rpc SetClimate(SetClimateRequest) returns (VehicleCommandResponse);
  rpc SetLights(SetLightsRequest) returns (VehicleCommandResponse);
  rpc SetScreen(SetScreenRequest) returns (VehicleCommandResponse);
  rpc SetMediaVolume(SetMediaVolumeRequest) returns (VehicleCommandResponse);
  rpc SetAdas(SetAdasRequest) returns (VehicleCommandResponse);
  rpc SetBatteryHeat(SetBatteryHeatRequest) returns (VehicleCommandResponse);
  rpc GetChargingSchedule(GetChargingScheduleRequest) returns (GetChargingScheduleResponse);
  rpc SetChargingSchedule(SetChargingScheduleRequest) returns (VehicleCommandResponse);
  rpc GetChargeCap(GetChargeCapRequest) returns (GetChargeCapResponse);
  rpc SetChargeCap(SetChargeCapRequest) returns (VehicleCommandResponse);
  rpc GetGpsLocation(GetGpsLocationRequest) returns (GetGpsLocationResponse);
  rpc StartGps(StartGpsRequest) returns (StartGpsResponse);
  rpc StopGps(StopGpsRequest) returns (StopGpsResponse);

  // BladeWatch-jwko: issues the short-lived second factor that actuating commands require from
  // a non-loopback caller. Never itself gated — you cannot need a token to get a token.
  rpc IssueActionToken(IssueActionTokenRequest) returns (IssueActionTokenResponse);

  // BladeWatch-6mnq: read-only probe of which declared ADAS_* ids actually resolve from the SDK
  // on this car (BladeWatch-2pnn.3). It was REST-only, and the reference said to add an RPC
  // "if a client needs it" — removing the REST surface is exactly that moment, and without this
  // the diagnostic would simply have vanished.
  rpc GetAdasInventory(GetAdasInventoryRequest) returns (GetAdasInventoryResponse);
}

// DoorStatus holds per-door lock state: 1=locked, 2=unlocked, -1=unknown.
message DoorStatus {
  int32 lf = 1;
  int32 rf = 2;
  int32 lr = 3;
  int32 rr = 4;
  int32 trunk = 5;
  int32 hood = 6;
  int32 overall = 7;
}

// WindowStatus holds per-window open percentage: 0=closed, 100=open, -1=unknown.
message WindowStatus {
  int32 lf = 1;
  int32 rf = 2;
  int32 lr = 3;
  int32 rr = 4;
  int32 sunroof = 5;
  int32 sunshade = 6;
}

message WindowCapabilities {
  bool sunroof = 1;
  bool sunshade = 2;
}

message VehicleCapabilities {
  WindowCapabilities windows = 1;
  // Seat control was removed end to end (BladeWatch-7bx4).
  reserved 2;
  reserved "seats";
}

message TrunkStatus {
  int32 lock_status = 1;
}

message SunroofStatus {
  int32 state = 1;
  int32 position = 2;
}

message BatteryStatus {
  double soc = 1;
  int32 range_km = 2;
  int32 bodywork_range_km = 3;

  // PHEV fuel leg. Both are OMITTED on a BEV rather than sent as 0: the
  // collector leaves fuel_percent NaN and fuel_range_km UNAVAILABLE there, and
  // a zero would render as a real "0%" / "0 km" readout on a car that has no
  // tank. Clients therefore treat "absent" as "not a fuel vehicle", which is
  // also how they decide whether to show the fuel readout at all -- there is no
  // separate is_phev flag on this message.
  double fuel_percent = 4;
  int32 fuel_range_km = 5;
}

message LightStatus {
  bool low_beam = 1;
  bool high_beam = 2;
  bool hazard = 3;
  bool day_time_light = 4;
}

message AdasStatus {
  bool speed_limit_warning = 1;
}

message ClimateStatus {
  // 3 was inside_temp_c: it carried BYDAutoAcDevice.getTemprature(4), which is the SDK's
  // AC_TEMPERATURE_OUT -- the outside air, not the cabin (BladeWatch-eh3u). The car exposes no
  // cabin temperature to this app.
  reserved 3;
  reserved "inside_temp_c";
  bool ac_on = 1;
  double setpoint_c = 2;
  int32 wind_mode = 4;
  int32 fan_level = 5;
  bool max_cooling = 6;
  // Outside air, BYDAutoInstrumentDevice.getOutCarTemperature(). Absent when unavailable --
  // optional, because 0 C is a real outside temperature.
  optional double outside_temp_c = 7;
}

message TyrePressure {
  int32 k_pa = 1;
  double psi = 2;
  int32 temp_c = 3 [json_name = "temperatureC"];
  int32 pressure_state = 4;
  int32 leak_state = 5 [json_name = "airLeakState"];
  int32 signal_state = 6;
}

message TyreStatus {
  TyrePressure fl = 1;
  TyrePressure fr = 2;
  TyrePressure rl = 3;
  TyrePressure rr = 4;
}

message GetVehicleStateRequest {}

message GetVehicleStateResponse {
  bool success = 1;
  DoorStatus doors = 2;
  WindowStatus windows = 3;
  VehicleCapabilities capabilities = 4;
  TrunkStatus trunk = 5;
  SunroofStatus sunroof = 6;
  BatteryStatus battery = 7;
  LightStatus lights = 8;
  AdasStatus adas = 9;
  // Seat status was removed with seat control (BladeWatch-7bx4).
  reserved 10;
  reserved "seats";
  ClimateStatus climate = 11;
  TyreStatus tyres = 12;
  string error = 13;
  // BladeWatch-2000.2: 0-100, converted from the raw AudioManager stream index so the UI
  // shows the real value rather than a local guess.
  int32 media_volume_percent = 14;
  bool media_muted = 15;
}

message GetAcDiagnosticsRequest {}
message GetAcDiagnosticsResponse {
  bool success = 1;
  string raw_json = 2;
}

// VehicleCommandResponse is a generic response for write commands.
message VehicleCommandResponse {
  bool success = 1;
  string message = 2;
  string error = 3;
  // Routing outcome from the server (e.g. "success", "not_supported", "failed").
  // The REST handler already emits this key via routedResponse().
  string outcome = 4;
  // The routing path taken (e.g. "sdk_only", "cloud_only"). Emitted by routedResponse().
  string path = 5;
}

message LockRequest {}
message UnlockRequest {}
message FlashRequest {}
message FindCarRequest {}

message TrunkRequest {
  // "open", "close", or "stop".
  string action = 1;
}

message MoveWindowRequest {
  // Window index: 0=all, 1=LF, 2=RF, 3=LR, 4=RR, 5=sunroof, 6=sunshade.
  int32 window_index = 1;
  // Direction: "open" or "close".
  string direction = 2;
  // Explicit presence: 0% (fully closed preset) is a default scalar and would
  // be omitted from JSON without optional, routing the request to the direction
  // path instead of the closed-loop positioning path.
  optional int32 target_percent = 3;
}

message SetClimateRequest {
  string action = 1;
  bool on = 2;
  double setpoint_c = 3;
  int32 fan_level = 4;
  int32 wind_mode = 5;
  bool max_cooling = 6;
  // Restore params: used when disabling max_cooling to re-apply prior AC state.
  bool restore_ac_on = 7;
  double restore_temp_c = 8;
  int32 restore_fan_level = 9;
  // BladeWatch-2000.1. Value meaning is not established in source (see
  // docs/byd-integrations.md) -- carried through unlabeled, the same way wind_mode above
  // already is; the UI does not offer a labelled picker for either.
  int32 cycle_mode = 10;
}

message SetLightsRequest {
  string action = 1;
  // Explicit presence: a pure disable request sets on=false, which a plain
  // proto3 bool would omit from the JSON wire (default-scalar omission), so
  // the handler would never see the boolean. optional forces it onto the wire.
  optional bool on = 2;
}

// BladeWatch-2000.3. Same explicit-presence reasoning as SetLightsRequest.on above: a
// screen-off request sets on=false, which a plain proto3 bool would omit from the wire.
message SetScreenRequest {
  optional bool on = 1;
}

// BladeWatch-2000.2: media volume and mute. Not routed through VehicleCommandRouter -- see
// docs/byd-integrations.md's "Media volume and mute" section for why.
message SetMediaVolumeRequest {
  // One of: "set", "step_up", "step_down", "mute", "unmute".
  string action = 1;
  // Required (0-100) when action == "set"; ignored for every other action.
  optional int32 percent = 2;
}

message SetAdasRequest {
  string action = 1;
  // Explicit presence: a pure disable request sets on=false, which a plain
  // proto3 bool would omit from the JSON wire (default-scalar omission), so
  // the handler would never see the boolean. optional forces it onto the wire.
  optional bool on = 2;
}

message SetBatteryHeatRequest {
  // Explicit presence: a pure disable request sets on=false, which a plain
  // proto3 bool would omit from the JSON wire (default-scalar omission), so
  // the handler would never see the boolean. optional forces it onto the wire.
  optional bool on = 1;
}

message GetChargingScheduleRequest {}

message GetChargingScheduleResponse {
  bool success = 1;
  bool enabled = 2;
  string start_charge_time = 3;
  string end_charge_time = 4;
  int32 charge_way = 5;
  string error = 6;
  // Whether charging-schedule readback is available. The BYD cloud source was
  // removed, so this currently reports false with reason "cloud_not_configured"
  // so the UI can hide the section instead of showing an empty schedule.
  bool supported = 7;
  string reason = 8;
}

message SetChargingScheduleRequest {
  string start_charge_time = 1;
  string end_charge_time = 2;
  int32 charge_way = 3;
  // Explicit presence: a pure "disable only" request sets enabled=false,
  // which a plain proto3 bool would omit from the JSON wire (default-scalar
  // omission), causing the handler's has("enabled") check to fail. optional
  // forces it onto the wire.
  optional bool enabled = 4;
}

message GetChargeCapRequest {}

message GetChargeCapResponse {
  bool success = 1;
  // Tri-state: the REST handler emits JSON null for "not yet probed". Marking
  // these optional lets a parsed null stay unset (has()=false) so the client
  // can distinguish "not probed" from a real 0/false.
  optional int32 percent = 2;
  optional bool enabled = 3;
  optional bool supported = 4;
  string error = 5;
}

message SetChargeCapRequest {
  int32 percent = 1;
  // Explicit presence: a pure disable request sets enabled=false, which a plain
  // proto3 bool would omit from the JSON wire (default-scalar omission), making
  // the handler's has("enabled") check fail. optional forces it onto the wire.
  optional bool enabled = 2;
}

message GetGpsLocationRequest {}

message GetGpsLocationResponse {
  bool success = 1;
  // Nested location object from GpsMonitor.getLocationJson().
  string location_json = 2;
  string google_maps_url = 3;
}

message StartGpsRequest {}

message StartGpsResponse {
  bool success = 1;
  string message = 2;
  string location_json = 3;
}

message StopGpsRequest {}

message StopGpsResponse {
  bool success = 1;
  string message = 2;
}


// ---- vehicle action token (uy93.5, restored on Connect by BladeWatch-jwko) ----

message IssueActionTokenRequest {}

message IssueActionTokenResponse {
  bool success = 1;
  // Present the token as the X-Vehicle-Action-Token header on actuating VehicleService calls.
  string token = 2;
  int32 expires_in_seconds = 3;
  string error = 4;
}


// ---- ADAS field inventory ----

message GetAdasInventoryRequest {}

message GetAdasInventoryResponse {
  bool success = 1;
  // The `adas` object as JSON: {sdkClassPresent, declared:[...], sdkOnly:[...]}.
  // NOTE: sdkClassPresent alone does NOT mean this car has ADAS — see byd-integrations.md.
  string adas_json = 2;
}
