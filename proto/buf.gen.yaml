version: v2
plugins:
  # Java protobuf message classes — generated into the app source tree.
  # Pinned to v35.0 (= "Protobuf Java Version: 4.35.0") to match
  # com.google.protobuf:protobuf-java:4.35.0 in app/build.gradle.kts. The
  # unpinned `latest` plugin drifts (e.g. v35.1 / 4.35.1) and stamps gencode
  # newer than the runtime, which fails protobuf's RuntimeVersion check at class
  # load and churns every generated file.
  - remote: buf.build/protocolbuffers/java:v35.0
    out: ../app/src/main/java

  # TypeScript protobuf message classes for Angular web UI.
  # Pinned for the same reason as the Java plugin above: the unpinned plugin
  # drifts (observed v2.12.0 -> v2.15.0), and since the generator stamps its own
  # version into every file's header banner, an unrelated `buf generate` rewrites
  # all 12 files under web/src/gen with a one-line diff each. That churn lands in
  # web/, which is a separate project and out of scope for the Flutter refactor.
  - remote: buf.build/bufbuild/es:v2.12.0
    out: ../web/src/gen
    opt:
      - target=ts
      - import_extension=none

  # Kotlin ConnectRPC service client stubs for Android app
  - remote: buf.build/connectrpc/kotlin
    out: ../app/src/main/java

  # Dart protobuf message classes for the Flutter in-car UI (BladeWatch-ncbb.1).
  # Messages only — no RPC client generation. The Flutter APK talks to the
  # daemon over plain HTTP + protobuf-JSON (see flutter_ui/lib/rpc/), hand-written
  # to mirror app/src/main/java/com/loabletech/bladewatch/client/ConnectClientProvider.kt,
  # using each message's generated toProto3Json()/fromProto3Json().
  # Pinned to v25.1.0 (this plugin's own release tags track protoc/protobuf
  # release trains, like the Java plugin above — NOT the `protobuf` Dart pub
  # package's independent version numbers) to match protobuf: ^6.1.0 in
  # flutter_ui/pubspec.yaml. Follow the Java entry's precedent: do not
  # unpin — see docs/build-and-operations.md for how to bump both together.
  - remote: buf.build/protocolbuffers/dart:v25.1.0
    out: ../flutter_ui/lib/gen
