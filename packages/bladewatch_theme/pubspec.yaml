name: bladewatch_theme
description: >-
  BladeWatch's M3 design tokens and ThemeData, shared by the in-car UI (flutter_ui)
  and the companion app (companion). Moved from flutter_ui/lib/theme by
  BladeWatch-rdtj.11 so the two apps cannot drift. Tested and coverage-gated through
  flutter_ui (its theme tests, and checkFlutterCoverage's --coverage-package).
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

flutter:
  # The HUD skin's typeface (docs/ui-ux-design-language.md, "HUD skin"): Space Mono, SIL OFL 1.1, bundled
  # (no google_fonts: the head unit works offline). Latin, Latin-Extended and Vietnamese only; other
  # scripts fall back to the platform font glyph by glyph. Apps see it as packages/bladewatch_theme/SpaceMono.
  fonts:
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono-Regular.ttf
        - asset: assets/fonts/SpaceMono-Bold.ttf
          weight: 700
  assets:
    # The typeface's licence, shown next to the app's own under Settings > About > License.
    - assets/fonts/OFL.txt
