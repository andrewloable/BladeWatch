name: bladewatch_rpc
description: >-
  BladeWatch's ConnectRPC client and generated protobuf messages, shared by the
  in-car UI (flutter_ui) and the companion app (companion). One copy on purpose:
  two would drift. Extracted from flutter_ui/lib/{rpc,gen/bladewatch} by
  BladeWatch-rdtj.10.
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  # Runtime for lib/gen/ (generated by protoc-gen-dart via proto/buf.gen.yaml,
  # pinned to v25.1.0 there -- keep these in step; see docs/build-and-operations.md).
  protobuf: ^6.1.0
  fixnum: ^1.1.1

dev_dependencies:
  # flutter_test rather than package:test so `flutter test --coverage` produces the
  # same lcov.info shape tools/check_flutter_coverage.sh already reads.
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
